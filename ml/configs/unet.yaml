model:
  architecture: "unet"
  num_classes: 1
  base_features: 32

dataset:
  root_dir: "."
  image_size: [256, 256]
  batch_size: 8
  num_workers: 2

training:
  epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  loss: "bce_dice"
  optimizer: "adamw"
  early_stopping_patience: 6
  use_amp: true
  grad_clip: 1.0
  checkpoint_dir: "models/checkpoints"
  reports_dir: "reports/training"

