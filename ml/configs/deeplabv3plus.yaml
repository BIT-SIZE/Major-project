model:
  architecture: "deeplabv3plus"
  num_classes: 1
  pretrained_backbone: true
  freeze_backbone: false

dataset:
  root_dir: "."
  image_size: [256, 256]
  batch_size: 8
  num_workers: 2

training:
  epochs: 20
  learning_rate: 0.0005
  backbone_learning_rate: 0.0001
  weight_decay: 0.0001
  loss: "bce_dice"
  optimizer: "adamw"
  early_stopping_patience: 5
  use_amp: true
  grad_clip: 1.0
  checkpoint_dir: "models/checkpoints"
  reports_dir: "reports/training"

